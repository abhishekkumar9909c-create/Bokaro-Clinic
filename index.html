<!DOCTYPE html>
<html>
<head>
    <title>Bokaro Clinic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            margin: 0;
        }
        .hero-section {
            background: #007bff;
            color: white;
            text-align: center;
        }
        .services-grid {
            display: flex;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .service-card {
            border: 1px solid #ccc;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<section class="hero-section" style="padding: 80px 0;">
    <div class="hero-content">
        <h2>Our Medical Services</h2>
        <p>Comprehensive Healthcare Solutions</p>
    </div>
</section>

<section style="padding: 60px 0; background: white;">
    <div class="services-grid">

        <div class="service-card">
            <h3>General Medicine</h3>
            <p>Routine checkups, fever treatment, and more.</p>
        </div>

        <div class="service-card">
            <h3>Cardiology</h3>
            <p>Heart care, ECG, BP monitoring.</p>
        </div>

    </div>
</section>

</body>
</html>
