<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0A7373" stroke="#05A8A8" stroke-width="3"/>
  
  <!-- Medical Cross -->
  <rect x="85" y="50" width="30" height="100" rx="5" fill="#FFFFFF"/>
  <rect x="60" y="75" width="80" height="30" rx="5" fill="#FFFFFF"/>
  
  <!-- Heartbeat Line -->
  <path d="M 40 100 L 60 100 L 70 80 L 80 120 L 90 100 L 160 100" 
        stroke="#FF6B6B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Medical Symbol Accent -->
  <circle cx="100" cy="100" r="18" fill="#0A7373" stroke="#FFFFFF" stroke-width="3"/>
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle">BC</text>
</svg>
